<aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <script>
        try {
            if (localStorage.getItem('taskfarmm_sidebar_collapsed') === '1') {
                document.getElementById('sidebar')?.classList.add('collapsed');
            }
        } catch(e) {}
    </script>
    {% if user.is_authenticated %}
    
    <nav class="sidebar-nav">
        <ul role="list">
            <li class="{% if active_page == 'dashboard' %}active{% endif %}">
                <a href="{% url 'dashboard' %}" title="Dashboard">
                    <i class="fas fa-th-large" aria-hidden="true"></i>
                    <span class="sidebar-link-text">Dashboard</span>
                </a>
            </li>
            <li class="{% if active_page == 'task_categories' or active_page == 'manage_projects' %}active{% endif %}">
                <a href="{% url 'manage_projects' %}" title="Manage Projects">
                    <i class="fas fa-folder-open" aria-hidden="true"></i>
                    <span class="sidebar-link-text">Manage Projects</span>
                </a>
            </li>
            <li class="{% if active_page == 'manage_kanban' %}active{% endif %}">
                <a href="{% url 'manage_kanban' %}" title="Kanban Board">
                    <i class="fas fa-columns" aria-hidden="true"></i>
                    <span class="sidebar-link-text">Kanban Board</span>
                </a>
            </li>
            {% if not user.profile.is_subuser %}
            <li class="{% if active_page == 'manage_subusers' %}active{% endif %}">
                <a href="{% url 'manage_team' %}" title="Team & Sub-Users">
                    <i class="fas fa-users-cog" aria-hidden="true"></i>
                    <span class="sidebar-link-text">Team Members</span>
                </a>
            </li>
            {% endif %}
            <li class="{% if active_page == 'ai_assistant' %}active{% endif %}">
                <a href="{% url 'ai_assistant' %}" title="AI Assistant">
                    <i class="fas fa-robot" aria-hidden="true"></i>
                    <span class="sidebar-link-text">AI Assistant</span>
                </a>
            </li>
        </ul>
    </nav>
    
    <div class="sidebar-bottom">
        <div class="sidebar-settings-link {% if active_page == 'privacy_center' %}active{% endif %}" style="margin-bottom: 4px;">
            <a href="{% url 'privacy_center' %}" title="Privacy & DPDP Rights">
                <i class="fas fa-shield-alt" aria-hidden="true"></i>
                <span class="sidebar-link-text">Privacy & Rights</span>
            </a>
        </div>

        <div class="sidebar-settings-link {% if active_page == 'settings' %}active{% endif %}">
            <a href="{% url 'settings' %}" title="Settings">
                <i class="fas fa-cog" aria-hidden="true"></i>
                <span class="sidebar-link-text">Settings</span>
            </a>
        </div>

        <div class="sidebar-divider"></div>
        
        <!-- Logout button -->
        <div class="logout-btn">
            <a href="{% url 'logout' %}" class="btn-logout" title="Logout" aria-label="Logout">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                <span class="sidebar-link-text">Logout</span>
            </a>
        </div>
    </div>
    {% else %}
    <div class="login-prompt">
        <p>Please log in to continue.</p>
        <div style="margin-top: 12px; font-size: 0.75rem;">
            <a href="{% url 'privacy_notice' %}" style="color: #71717a; text-decoration: underline;">Privacy Notice</a>
        </div>
    </div>
    {% endif %}
</aside>
